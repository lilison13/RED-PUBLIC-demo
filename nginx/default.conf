server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    location = / { try_files /red/index.html =404; }
    location = /ru { return 301 /ru/; }
    location = /ru/ { try_files /red/ru/index.html =404; }
    location = /red { return 301 /; }
    location = /red/ { return 301 /; }
    location = /red/ru { return 301 /ru/; }
    location = /red/ru/ { return 301 /ru/; }
    location = /map { return 301 /map/; }
    location = /map/ { try_files /red/map/index.html =404; }
    location = /map/location-polygons.json {
        alias /opt/oref-monitor/web/api/location_polygons;
        default_type application/json;
    }
    location = /red-location-polygons.json {
        alias /opt/oref-monitor/web/api/location_polygons;
        default_type application/json;
    }
    location = /red/beready { return 301 /red/beready/; }
    location = /red/beready/ru { return 301 /red/beready/ru/; }
    location = /red/beready/info { return 301 /red/beready/info.html; }
    location = /red/beready/ru/info { return 301 /red/beready/ru/info.html; }
    location /red/beready/ { index index.html; try_files $uri $uri/ =404; }
    # Only explicitly approved public files are exposed. Never proxy SMTP requests.
    location ~ ^/red/api/(status|history|latest_event|meta|zones|localities|beready_snapshot)$ {
        alias /opt/oref-monitor/web/api/$1;
        default_type application/json;
        limit_except GET { deny all; }
    }
    location /red/api/ { return 404; }
    location = /robots.txt { try_files $uri =404; }
    location / { return 404; }
}
